<!-- 块级元素 -->
<div>box a</div>
<div>box b</div>
<div>box c</div>

<!-- 默认在一行中排列，空间不足才换行 -->
<span>Java</span>
<span>Spring</span>
<span>React</span>

<br>

<!-- 行内块元素 -->
<div class="box">Java</div>
<div class="box">Spring</div>
<div class="box">MySQL</div>

<style>
  /*默认从上到下排列，通常占据父元素的整行 */
  div {
    width: 200px;
    height: 50px;
    background: lightblue;
    margin-bottom: 10px;
  }

  span {
    /* 虽然设置了 width 和 height，但普通 inline 元素不会按照这个宽高进行布局Vg */
    width: 100px;
    height: 100px;
    background: lightblue;
  }

  .box {
    /* - 像 inline：多个元素可以在同一行排列，不会强制换行。 */
    /* - 像 block：可以设置 width、height、margin、padding 等。  */
    display: inline-block;
    width: 120px;
    height: 80px;
    background-color: lightblue;
    margin: 10px;
  }
</style>
